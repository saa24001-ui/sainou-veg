            <p class="catch">

                <p>
                    炒め物や肉詰め、
                    サラダなど幅広い料理に活用できます。
                </p>

                <h2>✨ ピーマンの魅力</h2>

                <p>
                    苦味が少なく食べやすく、
                    栄養価も高いため健康づくりに役立ちます。
                </p>
